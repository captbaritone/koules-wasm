name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.10

      - name: Build with Emscripten
        run: |
          emcc --version
          bash build-wasm.sh
          ls -la koules.html koules.js koules.wasm koules.data

      - name: Stage Pages artifact
        run: |
          mkdir -p public
          mkdir -p public/sounds
          cp sounds/*.raw public/sounds/
          cp koules.html koules.js koules.wasm koules.data public/
          cp public/koules.html public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
