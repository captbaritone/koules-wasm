name = "koules-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The game client is served straight from here; /room/<name> falls
# through to the Worker for the WebSocket upgrade.
[assets]
directory = "public"

# One Durable Object per room, each running its own game server.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Emscripten emits the server as a separate .wasm; import it as a module.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
